version: 1
disable_existing_loggers: false
loggers:
  uvicorn:
    handlers: [default]
    level: INFO
  uvicorn.error:
    handlers: [default]
    level: INFO
formatters:
  default:
    "()": "loguru._appenders.LoguruFormatter"
handlers:
  default:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: default
